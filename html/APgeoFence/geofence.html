<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoFence</title>
  <link rel="stylesheet" href="css/control.css" />
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/map.css" />
  <script src="js/leaflet.js"></script>
</head>

<body>
  <header>
    <div class="brand">OpenKAI <span>GeoFence</span></div>
    <strong id="state">State: </strong>
  </header>

  <main class="workspace map-layout">
    <div class="map-panel">
      <div id="map" aria-label="Geofence map"></div>
    </div>

    <section class="panel console-panel" aria-label="Geofence controls">
      <h2>Geofence</h2>
      <div class="tools">
        <button id="btnSend" type="button" class="primary">Set</button>
        <button id="btnUndo" type="button">Undo</button>
        <button id="btnClear" type="button">Clear</button>
      </div>
      <div class="console-section">
        <h2>Console</h2>
        <strong id="msg"></strong>
        <label class="console-label" for="txtMsg">Messages</label>
        <textarea id="txtMsg" rows="4"></textarea>
      </div>
    </section>
  </main>

  <!-- Existing scripts retained; this page uses plain CSS for its theme. -->
  <script type="text/javascript"></script>
  <script src="js/mapUI.js"></script>
  <script src="js/wsBase.js"></script>
  <script src="js/wsGeoFence.js"></script>
</body>

</html>
