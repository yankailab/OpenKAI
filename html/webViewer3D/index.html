<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenKAI · 3D viewer</title>
  <link rel="stylesheet" href="css/viewer.css">
  <script defer src="js/wsCmdBase.js"></script>
  <script defer src="js/wsCmdHandler.js"></script>
  <script defer src="js/launcher.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="./">OpenKAI <span>3D viewer</span></a>
    <form id="connection">
      <label>IP / host <input id="host" value="127.0.0.1" required spellcheck="false" autocomplete="off"></label>
      <label>Stream port <input id="port" type="number" min="1" max="65535" value="8080" required></label>
      <button id="start" type="submit">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
    <output id="status" role="status">Ready</output>
  </header>
  <main>
    <div id="viewport" aria-label="Interactive 3D scene"></div>
    <div id="welcome">Connect to your OpenKAI backend<br><small>Point clouds and lines, live in your browser</small></div>
    <aside>
      <div class="tools">
        <button id="fit" type="button" disabled>Fit scene</button>
        <button id="reset" type="button" disabled>Reset camera</button>
        <label><input id="grid" type="checkbox" checked> Grid</label>
        <label>Point scale <input id="point-scale" type="range" min="0.25" max="5" step="0.25" value="1"></label>
      </div>
      <details open class="picker-panel">
        <summary>Grid cell picker</summary>
        <p>Click a cell to select or deselect it.</p>
        <output id="picker-count" aria-live="polite">0 picked cells</output>
        <div class="tools">
          <button id="picker-clear" type="button" disabled>Clear</button>
          <button id="picker-send" type="button" disabled>Send</button>
        </div>
        <output id="picker-status" role="status"></output>
      </details>
      <details open><summary>Objects</summary><div id="objects">No geometry sources</div></details>
      <details open class="command-panel">
        <summary>Commands</summary>
        <div class="tools">
          <label>Command port <input id="cmdPort" type="number" min="1" max="65535" value="7890" required></label>
          <button id="cmdConnect" type="button">Connect</button>
          <button id="cmdDisconnect" type="button" disabled>Disconnect</button>
        </div>
        <label class="console-label" for="cmdState">Command console</label>
        <textarea id="cmdState" rows="6" readonly spellcheck="false" aria-live="polite">Disconnected</textarea>
      </details>
    </aside>
    <footer><span>Drag to orbit · Right drag to pan · Scroll to zoom</span><output id="stats">Waiting for geometry</output></footer>
  </main>
</body>
</html>
